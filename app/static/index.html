<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Eye Communicator</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header id="bar">
    <div id="sentence" aria-live="polite"></div>
    <button class="target bar-btn" id="btn-speak" data-kind="speak" data-pos="speak"></button>
    <button class="target bar-btn" id="btn-clear" data-kind="clear" data-pos="clear"></button>
    <button class="target bar-btn help" id="btn-help" data-kind="help" data-pos="help"></button>
  </header>

  <main id="stage">
    <nav id="cats" aria-label="Categories"></nav>

    <section id="center">
      <div id="video-title"></div>
      <div id="video-box">
        <div id="yt"></div>
        <div id="video-msg"></div>
      </div>
      <div id="video-controls">
        <button class="target vbtn" id="v-prev" data-kind="video" data-pos="v-prev" aria-label="Previous video">&#9664;&#9664;</button>
        <button class="target vbtn" id="v-play" data-kind="video" data-pos="v-play" aria-label="Play or pause">&#9654; &#10074;&#10074;</button>
        <button class="target vbtn" id="v-next" data-kind="video" data-pos="v-next" aria-label="Next video">&#9654;&#9654;</button>
        <button class="target vbtn" id="v-vdown" data-kind="volume" data-repeat="1" data-pos="v-vdown"></button>
        <button class="target vbtn" id="v-mute" data-kind="video" data-pos="v-mute">
          <span id="vol-label"></span>
          <span id="vol-bar"><i></i></span>
        </button>
        <button class="target vbtn" id="v-vup" data-kind="volume" data-repeat="1" data-pos="v-vup"></button>
      </div>
    </section>

    <nav id="words" aria-label="Words"></nav>
  </main>

  <footer id="status">
    <span id="mode-badge"></span>
    <span id="calib-badge"></span>
    <span id="hint">G: mouse/gaze &middot; C: calibrate &middot; V: videos &middot; L: language &middot; F: fullscreen</span>
    <button id="btn-video">Videos (V)</button>
    <button id="btn-calib">Calibrate (C)</button>
    <button id="btn-lang" hidden></button>
  </footer>

  <div id="video-setup" hidden>
    <div class="box">
      <h2>Choose the videos</h2>
      <p>Make a playlist on YouTube (set it to <b>Unlisted</b> or <b>Public</b>), open it, and paste its address here.
         Videos are added or removed on YouTube, nothing to edit here. A single video link works too.</p>
      <input id="video-url" type="text" placeholder="https://www.youtube.com/playlist?list=..." autocomplete="off" spellcheck="false">
      <div id="video-setup-msg"></div>
      <div class="row">
        <button id="video-save" class="primary">Save</button>
        <button id="video-reset">Use the built-in video</button>
        <button id="video-close">Close</button>
      </div>
    </div>
  </div>

  <div id="calib" hidden>
    <div id="calib-marks"></div>
    <div id="calib-msg"></div>
    <div id="calib-dot"></div>
    <div id="calib-actions"></div>
    <pre id="calib-readout"></pre>
    <canvas id="calib-plot"></canvas>
  </div>

  <div id="help-alert" hidden>
    <div id="help-text"></div>
    <button class="target" id="help-cancel" data-kind="clear" data-pos="help-cancel"></button>
  </div>

  <div id="gaze-dot" hidden></div>

  <div id="start" role="button" tabindex="0"><span id="start-text"></span></div>

  <script src="/static/app.js"></script>
</body>
</html>
